name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel
      - name: Test
        run: ctest --preset debug

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc-release --parallel
      - name: Test
        run: ctest --preset msvc-release

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18.1.8
        run: pip install clang-format==18.1.8
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
